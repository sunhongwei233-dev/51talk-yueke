<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>51Talk 固定约课 · 可点原型</title>
  <style>
    :root {
      --yellow: #FFD100;
      --yellow-press: #F0C400;
      --ink: #1A1A1A;
      --muted: #8A8A8A;
      --sub: #5C5C5C;
      --line: #EEEEEE;
      --bg: #F5F5F5;
      --white: #FFFFFF;
      --green: #2BB673;
      --danger: #E85D4C;
      --blue: #3B82F6;
      --radius: 16px;
      --phone-w: 375px;
      --phone-h: 812px;
      --fit: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100svh; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #E8E4DC;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      min-height: 100%;
      padding: 24px;
    }
    .guide {
      display: none;
      width: 320px;
      color: #3A362E;
      line-height: 1.65;
      font-size: 14px;
    }
    .guide h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: -0.02em; }
    .guide p { margin-bottom: 12px; color: #5C564C; }
    .guide ol { padding-left: 18px; color: #5C564C; }
    .guide li { margin: 6px 0; }
    .guide kbd {
      background: #fff;
      border: 1px solid #D9D3C7;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
    }
    .stage {
      width: calc((var(--phone-w) + 16px) * var(--fit));
      height: calc((var(--phone-h) + 16px) * var(--fit));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      background: var(--white);
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(0,0,0,.18);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      border: 8px solid #1A1A1A;
      display: flex;
      flex-direction: column;
      transform: scale(var(--fit));
      transform-origin: center center;
    }
    .status {
      height: 44px;
      padding: 12px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      background: var(--white);
      flex-shrink: 0;
    }
    .status .dots { letter-spacing: 2px; font-size: 11px; }
    .app {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .screen { display: none; height: 100%; flex-direction: column; }
    .screen.on { display: flex; }
    .nav, .tabs, .bottom-nav, .dock, .stepper, .hint, .search, .locked, .credits, .composer, .days, .month-row, .week-row, .quick.bottom {
      flex-shrink: 0;
    }
    .nav {
      height: 44px;
      background: var(--white);
      display: flex;
      align-items: center;
      padding: 0 8px 0 4px;
      position: relative;
      flex-shrink: 0;
    }
    .nav .back, .nav .right {
      min-width: 88px;
      height: 44px;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: var(--sub);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .nav .back { justify-content: flex-start; padding-left: 8px; font-size: 22px; color: var(--ink); min-width: 44px; }
    .nav .title { flex: 1; text-align: center; font-size: 17px; font-weight: 650; }
    .nav .right { justify-content: flex-end; color: var(--sub); }
    .tabs {
      display: flex;
      background: var(--white);
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .tabs button {
      flex: 1;
      height: 42px;
      border: none;
      background: none;
      font-size: 15px;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      position: relative;
      font-weight: 500;
    }
    .tabs.free-tabs button { font-size: 13px; padding: 0 2px; }
    .tabs button.active { color: var(--ink); font-weight: 700; }
    .tabs button.active::after {
      content: "";
      position: absolute;
      left: 28%;
      right: 28%;
      bottom: 0;
      height: 3px;
      background: var(--yellow);
      border-radius: 3px 3px 0 0;
    }
    .scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .phone * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .phone *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .bottom-nav {
      height: 64px;
      background: var(--white);
      border-top: 1px solid var(--line);
      display: flex;
      flex-shrink: 0;
      padding-bottom: 8px;
    }
    .bottom-nav button {
      flex: 1;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 10px;
      color: #999;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .bottom-nav button.active { color: #C9A100; font-weight: 700; }
    .bottom-nav .ico { font-size: 20px; line-height: 1; }
    .msg-row {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 12px 16px;
      background: var(--white); border: none; border-bottom: 1px solid #F3F3F3;
      font-family: inherit; text-align: left; cursor: pointer; color: inherit;
    }
    .msg-ico {
      width: 44px; height: 44px; border-radius: 10px;

    .msg-ico.round { border-radius: 50%; font-size: 13px; color: var(--ink); }
    .msg-mid { flex: 1; min-width: 0; }
    .msg-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-preview { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-time { font-size: 11px; color: #C0C0C0; flex-shrink: 0; align-self: flex-start; padding-top: 2px; }
    .advisor-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--white);
      box-shadow: 0 -4px 16px rgba(0,0,0,.04);

    .advisor-bar .av {

      background: var(--yellow); display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .advisor-bar .nm { font-size: 14px; font-weight: 700; }
    .advisor-bar .role { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .advisor-bar .acts { margin-left: auto; display: flex; gap: 8px; }
    .wa-btn {
      height: 40px; padding: 0 14px; border-radius: 20px;
      background: #25D366; color: #fff; border: none;
      font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .wa-preview {
      background: var(--bg); border-radius: 12px; padding: 12px;
      font-size: 13px; color: var(--sub); line-height: 1.55; margin: 4px 0 12px;
    }
    .sheet.slots-sheet .btn-wa {
      width: 100%; margin-top: 4px; height: 48px;
      border: none; border-bottom: none; border-radius: 24px;
      background: #25D366; color: #fff; font-weight: 700;
    }
    .pad { padding: 16px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary { background: var(--yellow); color: var(--ink); }
    .btn-primary:disabled { background: #F0F0F0; color: #BBB; cursor: not-allowed; }
    .btn-ghost {
      background: var(--white);
      color: var(--ink);
      border: 1px solid #E5E5E5;
      font-weight: 600;
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:disabled { background: #F0F0F0; color: #BBB; cursor: not-allowed; }
    .btn-danger-ghost {
      background: var(--white);
      color: var(--danger);
      border: 1.5px solid var(--danger);
      font-weight: 700;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      font-weight: 650;
    }
    .empty { text-align: center; padding: 16px 20px 12px; }
    .illus { width: 120px; height: 88px; margin: 0 auto 8px; }
    .empty h2 { font-size: 18px; margin-bottom: 6px; }
    .empty .desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
    .benefits {
      text-align: left;
      background: var(--white);
      border-radius: 16px;
      padding: 6px 12px 8px;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .benefits .cap {
      font-size: 13px;
      font-weight: 700;
      color: #8A6D00;
      padding: 8px 4px 4px;
    }
    .whatis .body {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.65;
      padding: 4px 4px 10px;
    }
    .ben {
      display: flex;
      gap: 10px;
      padding: 8px 4px;
      align-items: flex-start;
    }
    .ben + .ben { border-top: 1px solid #F3F3F3; }
    .ben .n {
      width: 22px; height: 22px; border-radius: 50%;
      background: #FFF6C2; color: #8A6D00;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
    }
    .ben .t { font-size: 14px; font-weight: 700; }
    .ben .d { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
    .steps-preview {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 16px;
    }
    .sp {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 92px;
      position: relative;
    }
    .sp .n {
      width: 28px; height: 28px; border-radius: 50%;
      background: #FFF6C2; color: #8A6D00;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .sp span { font-size: 12px; color: var(--sub); margin-top: 6px; }
    .sp + .sp::before {
      content: "";
      position: absolute;
      left: -22px; top: 13px;
      width: 44px; height: 1.5px;
      background: #E8D98A;
    }
    .stepper {
      display: flex;
      padding: 12px 16px 8px;
      background: var(--white);
      gap: 8px;
      flex-shrink: 0;
    }
    .st { flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
    .st .bar { height: 4px; background: #EEE; border-radius: 4px; margin-bottom: 6px; }
    .st.on { color: var(--ink); font-weight: 650; }
    .st.on .bar { background: var(--yellow); }
    .st.done .bar { background: var(--yellow); }
    .hint em {
      font-style: normal;
      font-weight: 700;
      color: var(--ink);
      background: var(--yellow);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .hint {
      margin: 12px 16px 0;
      background: #FFF8D6;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: #6B5A00;
      line-height: 1.5;
    }
    .search {
      margin: 12px 16px 8px;
      height: 40px;
      border-radius: 20px;
      background: var(--white);
      border: 1px solid #E5E5E5;
      padding: 0 14px;
      width: calc(100% - 32px);
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
    }
    .search::placeholder { color: #B0B0B0; }
    .search:focus {
      outline: none;
      border-color: #E8C200;
      background: var(--white);
    }
    .sec-title {
      font-size: 13px;
      font-weight: 700;
      padding: 12px 16px 8px;
      color: var(--ink);
    }
    .tcard {
      margin: 0 16px 10px;
      background: var(--white);
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #F0E6C8;
    }
    .tcard:active { border-color: var(--yellow); }
    .tcard-main {
      display: flex;
      gap: 10px;
      padding: 12px 12px 10px;
      align-items: flex-start;
    }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      background: #EEE;
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    .badge-fav {
      position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      background: var(--yellow); font-size: 9px; padding: 1px 5px; border-radius: 8px;
      white-space: nowrap; font-weight: 700;
    }
    .tmeta { flex: 1; min-width: 0; }
    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tmeta .name { font-size: 15px; font-weight: 700; flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .play {
      width: 16px; height: 16px; border-radius: 50%;
      background: #FF8A3D; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 8px; flex-shrink: 0; line-height: 1;
    }
    .tags { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; background: #F4F4F4; color: var(--sub);
      padding: 3px 7px; border-radius: 4px;
    }
    .rate {
      color: #E85D4C;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tcard-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFF6E4;
      padding: 8px 0 8px 12px;
      font-size: 11px;
      color: var(--sub);
    }
    .tcard-bar .sep { width: 1px; height: 12px; background: #E8D9B0; }
    .tcard-bar .cert { color: #E48A2C; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .book-btn {
      margin-left: auto;
      height: 32px;
      padding: 0 12px;
      border: none;
      background: var(--yellow);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 16px 0 0 16px;
      white-space: nowrap;
    }
    .detail-link {
      margin-left: auto;
      border: none;
      background: none;
      color: #C9A100;
      font-weight: 650;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      padding: 0 8px;
      height: 32px;
    }
    .detail-link + .book-btn { margin-left: 0; }
    .hist-n {
      font-size: 11px;
      font-weight: 500;
      color: var(--sub);
      background: #F4F4F4;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .detail-nav .right {
      min-width: 88px;
      gap: 10px;
      font-size: 12px;
      color: var(--ink);
    }
    .detail-nav .heart { color: #E85D4C; font-weight: 700; }
    .hero {
      height: 180px;
      background: #2A2A2A center/cover no-repeat;
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero .play-lg {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #E85D4C; cursor: pointer; border: none;
    }
    .hero .brand {
      position: absolute; left: 12px; top: 10px;
      color: #fff; font-size: 12px; font-weight: 700;
    }
    .hero .sub {
      position: absolute; left: 12px; right: 12px; bottom: 10px;
      color: #fff; font-size: 11px; line-height: 1.4;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }
    .profile-card {
      margin: -28px 12px 0;
      background: var(--white);
      border-radius: 12px;
      padding: 14px 14px 12px;
      position: relative;
      z-index: 1;
    }
    .profile-card .top { display: flex; gap: 10px; align-items: center; }
    .profile-card .nm { font-size: 17px; font-weight: 700; }
    .profile-card .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .voice {
      margin-left: auto;
      width: 44px; height: 28px; border-radius: 14px;
      background: #4DA3FF; border: none; color: #fff; cursor: pointer;
      font-size: 14px;
    }
    .stats {
      display: flex;
      margin-top: 14px;
      text-align: center;
    }
    .stats div { flex: 1; }
    .stats .n { font-size: 20px; font-weight: 700; }
    .stats .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stats .split { width: 1px; background: var(--line); }

      background: var(--white);
      margin-top: 8px;
      padding: 14px 16px;
    }
    .sec h3 { font-size: 15px; margin-bottom: 10px; }
    .sec h3 .more { float: right; font-size: 12px; color: var(--muted); font-weight: 500; }
    .vids { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }

      border-radius: 8px; background: #DDD center/cover no-repeat;
      position: relative;
    }

      background: rgba(0,0,0,.45); color: #fff;
      font-size: 10px; display: flex; align-items: center; justify-content: center;
    }
    .bio { font-size: 13px; color: var(--sub); line-height: 1.65; }
    .bio.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .expand { text-align: right; font-size: 12px; color: var(--muted); margin-top: 6px; border: none; background: none; font-family: inherit; cursor: pointer; width: 100%; }
    .cert-row {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
    }
    .cert-row .ok { color: #2BB673; font-size: 16px; }
    .cert-row .view { margin-left: auto; color: var(--muted); font-size: 12px; }

    }

      min-width: 40px;
      width: 40px;
      height: 56px;
      padding: 6px 0;

      background: var(--white);
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font-size: 13px;
      font-weight: 650;
      color: var(--ink);

      height: 16px;

      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }

    .slot {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);

      el.textContent = msg;
      el.classList.add("on");
      setTimeout(() => el.classList.remove("on"), 1800);
    }
    function go(view, extra={}) {
      Object.assign(state, extra, { view, sheetId: null, slotsOpen: false, waSheet: false, bookSheet: false, pendingNewTeacherId: null, pendingNewSlot: null, pendingCancelId: null, pendingBlockedSlot: null, pendingLessonCancelId: null });
      render();
    }
    function openAdvisor() {
      state.advisorFrom = state.view;
      state.view = "advisor";
      render();
    }
    function navBar(title, opts={}) {
      const back = opts.back !== false;
      const advisor = opts.advisor === true;
      return `<div class="nav">
        <button class="back" ${back ? `onclick="historyBack()"` : ""}>${back ? "‹" : ""}</button>
        <div class="title">${title}</div>
        <button class="right" ${advisor ? `onclick="openAdvisor()"` : ""}>${advisor ? "联系班主任" : ""}</button>
      </div>`;
    }
    function stepper(n) {
      const labels = ["选老师","选时间","确认"];
      return `<div class="stepper">${labels.map((l,i) => {
        const k = i+1;
        const cls = k === n ? "st on" : (k < n ? "st done" : "st");
        return `<div class="${cls}"><div class="bar"></div>${k} ${l}</div>`;
      }).join("")}</div>`;
    }
    function bottomNav() {
      const tab = state.view === "messages" ? "messages" : "schedule";
      return `<div class="bottom-nav">
        <button onclick="toast('首页为示意')"><div class="ico">⌂</div>首页</button>
        <button class="${tab==="schedule"?"active":""}" onclick="go('home')"><div class="ico">▦</div>课表</button>
        <button class="${tab==="messages"?"active":""}" onclick="go('messages')"><div class="ico">💬</div>消息</button>
        <button onclick="toast('广场为示意')"><div class="ico">▷</div>广场</button>
        <button onclick="toast('账号为示意')"><div class="ico">☺</div>账号</button>
      </div>`;
    }
    function historyBack() {
      if (state.waSheet) { state.waSheet = false; render(); return; }
      if (state.bookSheet) { state.bookSheet = false; render(); return; }
      if (state.pendingNewTeacherId) { state.pendingNewTeacherId = null; render(); return; }
      if (state.pendingNewSlot) { state.pendingNewSlot = null; render(); return; }
      if (state.pendingCancelId) { state.pendingCancelId = null; render(); return; }
      if (state.pendingBlockedSlot) { state.pendingBlockedSlot = null; render(); return; }
      if (state.pendingLessonCancelId && state.view !== "cancelLesson") { state.pendingLessonCancelId = null; render(); return; }
      if (state.view === "advisor") return go(state.advisorFrom);
      if (state.view === "detail") return go("teacher");
      if (state.view === "teacher" && state.mode === "free") { state.homeTab = "mine"; return go("home"); }
      if (state.view === "teacher" && (state.mode === "changeTeacher" || state.mode === "lessonTeacher")) return go("home");
      if (state.view === "time" && (state.mode === "create" || state.mode === "free")) return go("teacher");
      if (state.view === "time" && (state.mode === "changeTime" || state.mode === "lessonTime")) return go("home");
      if (state.view === "confirm") return go("time");
      if (state.view === "success") return go("home");
      if (state.view === "lesson") return go("home");
      if (state.view === "cancelLesson") return closeLessonCancel();
      if (state.view === "help") return go("messages");
      if (state.view === "messages") return go("home");
      go("home");
    }

    function renderHome() {
      if (state.homeTab === "mine") return renderMine();
      if (state.homeTab === "done") {
        return `${navBar("课表", { back:false, advisor:false })}
          ${homeTabs()}
          <div class="scroll"><div class="ph">暂无已完课记录</div></div>
          ${bottomNav()}`;
      }
      if (!state.plans.length) return renderEmpty();
      return renderList();
    }
    function homeTabs() {
      return `<div class="tabs">
        <button class="${state.homeTab==="fixed"?"active":""}" onclick="state.homeTab='fixed';render()">固定计划</button>
        <button class="${state.homeTab==="mine"?"active":""}" onclick="state.homeTab='mine';render()">我的课程</button>
        <button class="${state.homeTab==="done"?"active":""}" onclick="state.homeTab='done';render()">已完课</button>
      </div>`;
    }
    function renderMine() {
      const list = state.lessons.filter(x => x.date === state.mineDate)
        .sort((a,b) => a.time.localeCompare(b.time));
      const week = WEEK.map(d => {
        const has = state.lessons.some(x => x.date === d.date);
        return `<button class="wd ${state.mineDate===d.date?"on":""} ${has?"has":""}" onclick="state.mineDate='${d.date}';render()">
          <div>${d.w.slice(1)}</div>
          <div class="n">${d.today ? "今" : d.n}</div>
          <div class="dot"></div>
        </button>`;
      }).join("");
      const cards = list.length ? list.map(les => {
        const t = teacher(les.teacherId);
        const fixed = les.type === "fixed";
        return `<div class="lcard" onclick="openLesson('${les.id}')">
          <div class="lcard-top">
            <div class="ltime">
              <div class="hm">${les.time}</div>
              <div class="dt">${dateLabel(les.date)}</div>
              ${fixed ? '<span class="tag-fixed">固定</span>' : ""}
            </div>
            <div class="lbody">
              <div class="ltitle">${les.title}</div>
              <div class="llevel">${les.level}</div>
              <div class="lteacher">${avatarHtml(t, false)} ${t.name}</div>
            </div>
          </div>
          <div class="lacts" onclick="event.stopPropagation()">
            <button onclick="event.stopPropagation();askCancelLesson('${les.id}')">取消</button>
            <button onclick="event.stopPropagation();startLessonChangeTime('${les.id}')">换时间</button>
            <button onclick="event.stopPropagation();startLessonChangeTeacher('${les.id}')">换老师</button>
          </div>
        </div>`;
      }).join("") : `<div class="ph">这一天没有课</div>`;
      return `${navBar("课表", { back:false, advisor:false })}
        ${homeTabs()}
        <div class="month-row"><span>2026年08月</span><button class="go-book">去约课</button></div>
        <div class="week-row">${week}</div>
        <div class="scroll">${cards}<div style="height:12px"></div></div>
        ${bottomNav()}`;
    }
    function openLesson(id) {
      state.editLessonId = id;
      go("lesson");
    }
    function renderLesson() {
      const les = lesson(state.editLessonId);
      if (!les) return renderMine();
      const t = teacher(les.teacherId);
      const fixed = les.type === "fixed";
      return `${navBar("课堂详情")}
        <div class="scroll">
          <div class="card">
            <div class="row"><span class="k">时间</span><span style="font-weight:700">${dateLabel(les.date)} ${les.time}–${endTime(les.time)}</span></div>
            <div class="row"><span class="k">老师</span><span class="teacher-val">${avatarHtml(t, false)}<span>${t.name}</span></span></div>
            <div class="row"><span class="k">类型</span><span>${fixed ? '<span class="tag-fixed">固定</span> 固定约课' : "自由约课"}</span></div>
            <div class="rule">
              <div class="t">${les.title}</div>
              <div class="s">${les.level}</div>
            </div>
          </div>
          <div class="pad">
            <button class="btn btn-primary" onclick="startLessonChangeTime('${les.id}')">换时间</button>
            <div style="height:10px"></div>
            <button class="btn btn-ghost" onclick="startLessonChangeTeacher('${les.id}')">换老师</button>
            <div style="height:10px"></div>
            <button class="btn btn-outline" onclick="askCancelLesson('${les.id}')">取消这一节</button>
          </div>
        </div>`;
    }
    function renderEmpty() {
      return `${navBar("课表", { back:false, advisor:false })}
        ${homeTabs()}
        <div class="scroll">
          <div class="empty">
            ${illus()}
            <h2>还没有固定学习计划</h2>
            <p class="desc">设定每周固定时间和老师，系统自动帮你占课，不用每周抢。</p>
            <div class="steps-preview">
              <div class="sp"><div class="n">1</div><span>选老师</span></div>
              <div class="sp"><div class="n">2</div><span>选时间</span></div>
              <div class="sp"><div class="n">3</div><span>确认</span></div>
            </div>
            <button class="btn btn-primary" onclick="startCreate()">开始设置固定约课</button>
            <div style="height:10px"></div>
            <button class="btn btn-ghost" onclick="openAdvisor()">联系班主任</button>
            <div class="benefits whatis">
              <div class="cap">什么是固定学习计划</div>
              <div class="body">一次性设定每周上课时间和老师（例如每周五 17:00），系统按这个周期自动帮你占课，不用每周手动抢课。每上完 1 节扣 1 次次卡，并自动顺延到下一周。可以随时换老师、换时间，或暂停、取消某一条计划。</div>
            </div>
            <div class="benefits">
              <div class="cap">为什么要设置固定计划</div>
              <div class="ben"><div class="n">1</div><div><div class="t">养成学习习惯</div><div class="d">不用每周想约不约、约谁，固定节奏更容易坚持。</div></div></div>
              <div class="ben"><div class="n">2</div><div><div class="t">锁定心仪老师</div><div class="d">热门老师课位容易秒空，固定约课等于提前长期占坑。</div></div></div>
              <div class="ben"><div class="n">3</div><div><div class="t">方便家庭排期</div><div class="d">「每周五 17:00」可预期，接送和其他兴趣班更好安排。</div></div></div>
              <div class="ben"><div class="n">4</div><div><div class="t">多时段可组合</div><div class="d">工作日晚上、周末上午可以拼在同一位老师下。</div></div></div>
            </div>
          </div>
        </div>
        ${bottomNav()}`;
    }
    function illus() {
      return `<svg class="illus" viewBox="0 0 160 120" fill="none">
        <rect x="38" y="42" width="84" height="52" rx="8" fill="#FFD100"/>
        <rect x="46" y="34" width="28" height="36" rx="4" fill="#FFF" stroke="#E8C200"/>
        <rect x="78" y="28" width="28" height="42" rx="4" fill="#FFF" stroke="#E8C200"/>
        <circle cx="92" cy="44" r="8" fill="#F3C4A4"/>
        <circle cx="60" cy="48" r="6" fill="#E7B6B9"/>
        <path d="M30 28h8M122 24h10M28 70h6M126 66h8" stroke="#7EC8F8" stroke-width="3" stroke-linecap="round"/>
      </svg>`;
    }
    function renderList() {
      const cards = state.plans.map(p => {
        const t = teacher(p.teacherId);
        const lines = formatSlotsLines(p.slots);
        return `<div class="pcard ${p.paused ? "paused" : ""}">
          <div class="phead">
            <div class="avatar" style="width:40px;height:40px"><img src="${t.photo}" alt="${t.name}"></div>
            <div>
              <div style="font-weight:700">${t.name}</div>
              <div class="pmeta">★ ${t.rating} · ${t.exp}</div>
            </div>
            <span class="status-chip ${p.paused?"pause":""}">${p.paused?"已暂停":"进行中"}</span>
            <button class="more" onclick="state.sheetId='${p.id}';render()">⋯</button>
          </div>
          <div class="ptimes">${lines.join("<br>")}</div>
          <div class="pmeta">按周循环，直到次卡用完</div>
          <div class="pacts">
            <button onclick="startChangeTeacher('${p.id}')">换老师</button>
            <button onclick="startChangeTime('${p.id}')">换时间</button>
          </div>
        </div>`;
      }).join("");
      return `${navBar("课表", { back:false, advisor:false })}
        ${homeTabs()}
        <div class="credits">剩余次卡 <b>${state.credits}</b> 次 · 每上完 1 节扣 1 次</div>
        <div class="scroll">${cards}
          <div class="pad">
            <button class="btn btn-primary" onclick="startCreate()">新增固定约课</button>
            <div style="height:10px"></div>
            <button class="btn btn-ghost" onclick="openAdvisor()">联系班主任</button>
          </div>
        </div>
        ${bottomNav()}
        ${sheetHtml()}`;
    }
    function sheetHtml() {
      if (!state.sheetId) return `<div class="mask"></div>`;
      const p = state.plans.find(x => x.id === state.sheetId);
      const pauseLabel = p && p.paused ? "恢复这条固定约课" : "暂停这条固定约课";
      return `<div class="mask on" onclick="if(event.target===this){state.sheetId=null;render()}">
        <div class="sheet">
          <button onclick="togglePause('${state.sheetId}')">${pauseLabel}</button>
          <button class="danger" onclick="askCancelPlan('${state.sheetId}')">取消这条固定计划</button>
          <button class="cancel" onclick="state.sheetId=null;render()">关闭</button>
        </div>
      </div>`;
    }
    function openSlotsSheet() {
      if (!state.slots.length) return;
      state.slotsOpen = true;
      render();
    }
    function closeSlotsSheet() {
      state.slotsOpen = false;
      render();
    }
    function slotsSheetHtml() {
      if (!state.slotsOpen || !state.slots.length) return "";
      const free = state.mode === "free";
      const rows = state.slots.map((key) => {
        return `<div class="slot-row">
          <div>
            <div class="t">${free ? formatOnce(key) : formatSlotsLines([key])[0]}</div>
            <div class="s">${free ? "单次 · 25 分钟" : "每周循环 · 每节 25 分钟"}</div>
          </div>
        </div>`;
      }).join("");
      return `<div class="mask on" onclick="if(event.target===this)closeSlotsSheet()">
        <div class="sheet slots-sheet">
          <div class="grab"></div>
          <div class="sheet-head">已选 ${state.slots.length} 个时段</div>
          <div class="slots-list">${rows}</div>
          <button class="btn btn-primary" onclick="closeSlotsSheet()">关闭</button>
        </div>
      </div>`;
    }
    function avatarHtml(t, fav) {
      return `<div class="avatar"><img src="${t.photo}" alt="${t.name}">${fav ? '<span class="badge-fav">收藏</span>' : ""}</div>`;
    }
    function teacherCard(t, extra="") {
      const free = state.mode === "free";
      const cta = free
        ? `<button class="detail-link" onclick="event.stopPropagation();openDetail('${t.id}')">查看详情</button>
          <button class="book-btn" onclick="event.stopPropagation();pickTeacher('${t.id}')">约课</button>`
        : `<button class="book-btn" onclick="event.stopPropagation();openDetail('${t.id}')">查看详情</button>`;
      return `<div class="tcard" onclick="pickTeacher('${t.id}')">
        <div class="tcard-main">
          ${avatarHtml(t, t.fav)}
          <div class="tmeta">
            <div class="name-row">
              <div class="name">${t.name}<span class="play">▶</span>${extra}</div>
              <span class="rate">★ ${t.rating}</span>
            </div>
            <div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
          </div>
        </div>
        <div class="tcard-bar">
          <span class="cert">◆ ${t.cert}</span>
          <span class="sep"></span>
          <span>${t.exp}</span>
          <span class="sep"></span>
          <span>${t.edu}</span>
          ${cta}
        </div>
      </div>`;
    }
    function filteredTeachers() {
      const q = state.search.trim().toLowerCase();
      const pool = state.mode === "free" ? TEACHERS : TEACHERS.filter(t => t.core);
      return pool.filter(t => !q || t.name.toLowerCase().includes(q));
    }
    function renderTeacher() {
      if (state.mode === "free") return renderFreeTeacher();
      const changing = state.mode === "changeTeacher" || state.mode === "lessonTeacher";
      const currentId = state.mode === "changeTeacher"
        ? (state.plans.find(p => p.id === state.editId) || {}).teacherId
        : (lesson(state.editLessonId) || {}).teacherId;
      const keep = state.mode === "lessonTeacher" ? (state.keepSlot || (lesson(state.editLessonId) && lessonSlotKey(lesson(state.editLessonId)))) : null;
      let list = filteredTeachers();
      if (keep) list = list.filter(t => t.id === currentId || !isTeacherFull(t.id, keep));
      const others = list.filter(t => t.id !== currentId);
      const noOtherForSlot = state.mode === "lessonTeacher" && keep && !others.length;
      const fav = list.filter(t => t.fav);
      const recent = list.filter(t => t.recent && !t.fav);
      const rest = list.filter(t => !t.fav && !t.recent);
      let body = "";
      if (noOtherForSlot) {
        body = `<div class="ph">这个时间暂时没有其他老师</div>
          <div class="pad">
            <button class="btn btn-primary" onclick="startLessonChangeTime('${state.editLessonId}')">换时间（仍跟当前老师）</button>
            <div style="height:10px"></div>
            <button class="btn btn-ghost" onclick="go('home')">不改了</button>
          </div>`;
      } else {
        if (!fav.length && !state.search) {
          body += `<div class="hint">收藏过的老师会排在最前，方便固定约。下面是你最近约过的老师。</div>`;
        }
        if (fav.length) {
          body += `<div class="sec-title">我的收藏</div>` + fav.map(t => teacherCard(t, currentId===t.id ? '<span class="current-mark">当前</span>' : "")).join("");
        }
        if (recent.length) {
          body += `<div class="sec-title">最近约过</div>` + recent.map(t => teacherCard(t, currentId===t.id ? '<span class="current-mark">当前</span>' : "")).join("");
        }
        if (rest.length) {
          body += `<div class="sec-title">全部老师</div>` + rest.map(t => teacherCard(t)).join("");
        }
        if (!list.length) {
          body += `<div class="ph">没有找到老师</div>`;
        }
      }
      const title = changing ? "换老师" : "选老师";
      const hint = state.mode === "lessonTeacher"
        ? lessonOnceHint()
        : (state.mode === "changeTeacher" ? `<div class="hint">上课时间保持不变，只更换老师。</div>` : "");
      return `${navBar(title, changing ? { advisor:false } : {})}${changing ? "" : stepper(1)}
        ${hint}
        <input class="search" placeholder="搜索老师姓名" value="${escapeAttr(state.search)}" oninput="state.search=this.value;render()">
        <div class="scroll">${body}<div style="height:16px"></div></div>
        ${changing ? `<div class="dock"><div class="count">选中后需确认才更换</div></div>` : ""}`;
    }
    function renderFreeTeacher() {
      const tab = state.freeTab || "pick";
      const history = HISTORY_ORDER.map(id => teacher(id)).filter(Boolean);
      const fav = TEACHERS.filter(t => t.fav);
      const pick = TEACHERS.filter(t => t.pick);
      const shown = tab === "pick" ? pick : (tab === "global" ? TEACHERS : (tab === "fav" ? fav : history));
      const extra = (t) => {
        if (tab !== "history") return "";
        const n = HISTORY_COUNTS[t.id];
        return n ? `<span class="hist-n">上过 ${n} 次</span>` : "";
      };
      let body = "";
      if (!shown.length) {
        body = `<div class="ph">${tab === "fav" ? "还没有收藏老师" : "没有老师"}</div>`;
      } else {
        body = shown.map(t => teacherCard(t, extra(t))).join("");
      }
      return `${navBar("选老师")}${stepper(1)}
        <div class="tabs free-tabs">
          <button class="${tab==="pick"?"active":""}" onclick="state.freeTab='pick';render()">优选</button>
          <button class="${tab==="global"?"active":""}" onclick="state.freeTab='global';render()">全球</button>
          <button class="${tab==="fav"?"active":""}" onclick="state.freeTab='fav';render()">收藏</button>
          <button class="${tab==="history"?"active":""}" onclick="state.freeTab='history';render()">历史约过</button>
        </div>
        <div class="scroll">${body}<div style="height:16px"></div></div>`;
    }
    function renderTime() {
      const t = teacher(state.teacherId);
      if (!t) return state.mode === "free" ? renderFreeTeacher() : renderTeacher();
      const isFree = state.mode === "free";
      const replaceTime = state.mode === "changeTime" || state.mode === "lessonTime";
      const single = replaceTime;
      const exceptPlan = state.mode === "changeTime" ? state.editId : null;
      const exceptLes = state.mode === "lessonTime" ? state.editLessonId : null;
      const occ = occupiedKeys(exceptPlan, exceptLes);
      const unavail = new Set(UNAVAILABLE[state.teacherId] || []);
      const knownFull = new Set(state.knownFullSlots || []);
      const origin = single ? state.originSlot : null;
      const grid = timesForDay(state.day).map(time => {
        const key = slotKey(state.day, time);
        const taken = occ.has(key);
        const isFull = knownFull.has(key) || (isFree && (FULL_SLOTS[state.teacherId] || []).includes(key));
        const isCur = origin === key;
        const off = (unavail.has(key) || taken || isFull) && !isCur;
        const on = !isCur && state.slots.includes(key);
        const label = off ? (isFull ? "已满" : (taken ? "已占用" : time)) : time;
        const cls = `slot ${on?"on":""} ${off?"off":""} ${isCur?"cur":""}`;
        const mark = isCur ? '<span class="now">当前</span>' : (on && !isFree ? '<span class="rec">↻</span>' : "");
        return `<button class="${cls}" ${off?"":`onclick="toggleSlot('${key}')"`}>${label}${mark}</button>`;
      }).join("");
      const badgeKeys = single ? [origin, ...state.slots].filter(Boolean) : state.slots;
      const days = DAYS.map(d => {
        const n = badgeKeys.filter(s => s.startsWith(d + "-")).length;
        const badge = n ? `<span class="day-badge">${n}</span>` : "";
        return `<button class="${state.day===d?"on":""}" onclick="state.day='${d}';render()">${[...d].map(ch => `<span>${ch}</span>`).join("")}${badge}</button>`;
      }).join("");
      const originText = origin ? formatSlotsLines([origin])[0] : "";
      const replaceText = !state.slots[0] ? "" : (state.mode === "lessonTime" ? formatOnce(state.slots[0]) : formatSlotsLines(state.slots)[0]);
      const hint = isFree
        ? `<div class="hint">可选多个时间，每节单独约一次。</div>`
        : (state.mode === "lessonTime"
          ? lessonOnceHint()
          : (replaceTime
            ? `<div class="hint">当前固定时间：${originText}。请另选 1 个时段替换，老师不变。</div>`

    function toggleSlot(key) {

        render();

      const i = state.slots.indexOf(key);
      if (i >= 0) state.slots.splice(i, 1);
      else state.slots.push(key);

        const da = DAYS.indexOf(a.split("-")[0]);
        const db = DAYS.indexOf(b.split("-")[0]);
        if (da !== db) return da - db;
        return TIMES_LONG.indexOf(a.split("-")[1]) - TIMES_LONG.indexOf(b.split("-")[1]);
      });
      render();
    }
    function nextFromTime() {
      if (!state.slots.length) return;
      if (state.mode === "lessonTime") {
        if (state.slots[0] === state.originSlot) { toast("请选择一个新的时间"); return; }
        if (isTeacherFull(state.teacherId, state.slots[0])) {
          state.pendingBlockedSlot = state.slots[0];
          render();
          return;
        }
        state.pendingNewSlot = state.slots[0];
        render();
        return;
      }
      if (state.mode === "changeTime") {
        if (state.slots[0] === state.originSlot) { toast("请选择一个新的时间"); return; }
        state.pendingNewSlot = state.slots[0];
        render();
        return;
      }
      go("confirm");
    }
    function cancelChangeTime() {
      state.pendingNewSlot = null;
      render();
    }
    function confirmChangeTime() {
      if (state.mode === "lessonTime") {
        const les = lesson(state.editLessonId);
        if (!les || !state.pendingNewSlot) return;
        applySlotToLesson(les, state.pendingNewSlot);
        state.mineDate = les.date;
        toast("这一节时间已更新");
        go("home");
        return;
      }
      const p = state.plans.find(x => x.id === state.editId);
      if (!p || !state.pendingNewSlot) return;
      p.slots = [state.pendingNewSlot];
      toast("固定时间已更新");
      go("home");
    }
    function timeConfirmHtml() {
      const oldT = state.mode === "lessonTime" ? formatOnce(state.originSlot) : formatSlotsLines([state.originSlot])[0];
      const newT = state.mode === "lessonTime" ? formatOnce(state.pendingNewSlot) : formatSlotsLines([state.pendingNewSlot])[0];
      const t = teacher(state.teacherId);
      const sub = state.mode === "lessonTime"
        ? `只改这一节，老师 ${t.name} 不变`
        : `老师 ${t.name} 保持不变`;
      return `<div class="mask on center" onclick="if(event.target===this)cancelChangeTime()">
        <div class="dialog">
          <div class="dialog-title">确认更换时间？</div>
          <div class="dialog-sub">${sub}</div>
          <div class="swap stack">
            <div class="swap-side">
              <div class="lab">将被替换</div>
              <div class="nm">${oldT}</div>
            </div>
            <div class="swap-arrow">↓</div>
            <div class="swap-side">
              <div class="lab">新选择</div>
              <div class="nm">${newT}</div>
            </div>
          </div>
          <div class="dialog-acts">
            <button class="btn btn-ghost" onclick="cancelChangeTime()">取消</button>
            <button class="btn btn-primary" onclick="confirmChangeTime()">确认更换</button>
          </div>
        </div>
      </div>`;
    }
    function confirmCreate() {
      state.slots.forEach((slot, i) => {
        const [w, tm] = slot.split("-");
        state.plans.push({
          id: "p" + Date.now() + "-" + i,
          teacherId: state.teacherId,
          slots: [slot],
          paused: false
        });
        state.lessons.push({
          id: "l" + Date.now() + "-" + i,
          teacherId: state.teacherId,
          date: weekdayToDate(w),
          time: tm,
          weekday: w,
          type: "fixed",
          title: "固定课程",
          level: "1v1"
        });
      });
      go("success");
    }
    function startChangeTeacher(id) {
      const p = state.plans.find(x => x.id === id);
      state.mode = "changeTeacher";
      state.editId = id;
      state.teacherId = p.teacherId;
      state.search = "";
      go("teacher");
    }
    function startChangeTime(id) {
      const p = state.plans.find(x => x.id === id);
      state.mode = "changeTime";
      state.editId = id;
      state.teacherId = p.teacherId;
      state.originSlot = p.slots[0];
      state.slots = [];
      state.day = state.originSlot ? state.originSlot.split("-")[0] : "周五";
      go("time");
    }
    function startLessonChangeTime(id) {
      const les = lesson(id);
      state.mode = "lessonTime";
      state.editLessonId = id;
      state.teacherId = les.teacherId;
      state.originSlot = lessonSlotKey(les);
      state.slots = [];
      state.keepSlot = null;
      state.knownFullSlots = [];
      state.day = les.weekday;
      go("time");
    }
    function startLessonChangeTeacher(id, keepSlot) {
      const les = lesson(id);
      state.mode = "lessonTeacher";
      state.editLessonId = id;
      state.teacherId = les.teacherId;
      state.keepSlot = keepSlot || lessonSlotKey(les);
      state.search = "";
      go("teacher");
    }
    function askCancelLesson(id) {
      state.cancelFrom = state.view;
      state.pendingLessonCancelId = id;
      state.cancelReason = "";
      state.cancelReasonOther = "";
      state.view = "cancelLesson";
      render();
    }
    function closeLessonCancel() {
      const back = state.cancelFrom || "home";
      state.pendingLessonCancelId = null;
      state.cancelReason = "";
      state.cancelReasonOther = "";
      state.view = back;
      render();
    }
    function pickCancelReason(id) {
      state.cancelReason = id;
      if (id !== "other") state.cancelReasonOther = "";
      render();
    }
    function canConfirmCancelLesson() {
      if (!state.cancelReason) return false;
      if (state.cancelReason === "other" && !state.cancelReasonOther.trim()) return false;
      return true;
    }
    function confirmCancelLesson() {
      if (!canConfirmCancelLesson()) {
        toast(state.cancelReason === "other" ? "请填写详细取消原因" : "请选择取消原因");
        return;
      }
      const id = state.pendingLessonCancelId;
      const les = lesson(id);
      state.lessons = state.lessons.filter(x => x.id !== id);
      state.pendingLessonCancelId = null;
      state.cancelReason = "";
      state.cancelReasonOther = "";
      toast(les && les.type === "fixed" ? "已取消这一节，下周仍会按计划约课" : "已取消这一节课");
      go("home");
    }
    function renderCancelLesson() {
      const les = lesson(state.pendingLessonCancelId);
      if (!les) return renderMine();
      const t = teacher(les.teacherId);
      const hit = WEEK.find(x => x.date === les.date);
      const day = hit ? "08月" + String(hit.n).padStart(2,"0") + "日" : les.date;
      const when = day + " | " + les.weekday + " | " + les.time;
      const reasons = CANCEL_REASONS.map(r => {
        const on = state.cancelReason === r.id;
        const extra = r.id === "other" && on
          ? `<textarea id="cancelOther" class="reason-other" placeholder="请填写详细取消原因" oninput="state.cancelReasonOther=this.value;var b=document.getElementById('cancelOk');if(b)b.disabled=!this.value.trim()">${escapeHtml(state.cancelReasonOther)}</textarea>`
          : "";
        return `<button class="reason ${on?"on":""}" onclick="pickCancelReason('${r.id}')">
            <span>${r.label}</span>
            <span class="radio"></span>
          </button>${extra}`;
      }).join("");
      const ok = canConfirmCancelLesson();
      return `<div class="cancel-page">
        <div class="nav">
          <button class="back"></button>
          <div class="title">是否取消本次课堂？</div>
          <button class="right" onclick="closeLessonCancel()">✕</button>
        </div>
        <div class="scroll">
          <div class="csec">
            <div class="csec-h"><span class="dot"></span>取消课堂信息</div>
            <div class="cinfo">
              ${avatarHtml(t, false)}
              <div>
                <div class="when">${when}</div>
                <div class="who">${t.name}</div>
              </div>
            </div>
            ${les.type === "fixed" ? '<div class="cnote">只取消这一节，下周仍会按固定计划约课</div>' : ""}
          </div>
          <div class="csec">
            <div class="csec-h"><span class="dot"></span>取消课堂原因</div>
            ${reasons}
          </div>
        </div>
        <div class="cancel-dock">
          <button class="btn btn-danger-ghost" onclick="closeLessonCancel()">再想想</button>
          <button class="btn btn-danger" id="cancelOk" ${ok ? "" : "disabled"} onclick="confirmCancelLesson()">确认</button>
        </div>
      </div>`;
    }
    function closeBlocked() {
      state.pendingBlockedSlot = null;
      render();
    }
    function pickOtherTimeAfterBlock() {
      if (state.pendingBlockedSlot && !state.knownFullSlots.includes(state.pendingBlockedSlot)) {
        state.knownFullSlots.push(state.pendingBlockedSlot);
      }
      state.pendingBlockedSlot = null;
      state.slots = [];
      render();
    }
    function switchTeacherKeepTime() {
      const slot = state.pendingBlockedSlot;
      const id = state.editLessonId;
      startLessonChangeTeacher(id, slot);
    }
    function blockedHtml() {
      const t = teacher(state.teacherId);
      const [d, tm] = (state.pendingBlockedSlot || "").split("-");
      return `<div class="mask on center" onclick="if(event.target===this)closeBlocked()">
        <div class="dialog">
          <div class="dialog-title">这个时间老师没空</div>
          <div class="dialog-sub">${t.name} ${d} ${tm} 已被约满</div>
          <div class="dialog-acts" style="flex-direction:column">
            <button class="btn btn-primary" onclick="pickOtherTimeAfterBlock()">换一个她有空的时间</button>
            <button class="btn btn-ghost" onclick="switchTeacherKeepTime()">这个时间换别的老师</button>
          </div>
          <button class="linkish" onclick="go('home')">不改了</button>
        </div>
      </div>`;
    }
    function togglePause(id) {
      const p = state.plans.find(x => x.id === id);
      p.paused = !p.paused;
      state.sheetId = null;
      toast(p.paused ? "已暂停，不再自动占下一周期" : "已恢复固定约课");
      render();
    }
    function askCancelPlan(id) {
      state.sheetId = null;
      state.pendingCancelId = id;
      render();
    }
    function closeCancelConfirm() {
      state.pendingCancelId = null;
      render();
    }
    function confirmCancelPlan() {
      const id = state.pendingCancelId;
      state.plans = state.plans.filter(x => x.id !== id);
      state.pendingCancelId = null;
      toast("已取消这条固定计划");
      render();
    }
    function cancelConfirmHtml() {
      const p = state.plans.find(x => x.id === state.pendingCancelId);
      if (!p) return "";
      const t = teacher(p.teacherId);
      const time = formatSlotsLines(p.slots)[0];
      return `<div class="mask on center" onclick="if(event.target===this)closeCancelConfirm()">
        <div class="dialog">
          <div class="dialog-title">确认取消这条固定计划？</div>
          <div class="dialog-sub">取消后不再自动占课，不影响其他固定计划</div>
          <div class="swap stack">
            <div class="swap-side">
              ${avatarHtml(t, false)}
              <div class="nm">${t.name}</div>
              <div class="lab" style="margin-top:6px">${time}</div>
            </div>
          </div>
          <div class="dialog-acts">
            <button class="btn btn-ghost" onclick="closeCancelConfirm()">再想想</button>
            <button class="btn btn-danger" onclick="confirmCancelPlan()">确认取消</button>
          </div>
        </div>
      </div>`;
    }
    function sendMsg(text) {
      state.messages.push({ from:"me", text });
      state.messages.push({ from:"advisor", text:"已收到。班主任工作时间内会回复你，也可以继续补充想固定的老师和时间。" });
      render();
    }
    function sendTyped() {
      const el = $("#msgInput");
      const v = (el && el.value || "").trim();
      if (!v) return;
      sendMsg(v);
    }
    function escapeAttr(s) {
      return String(s).replace(/"/g, "&quot;");
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function render() {
      const active = document.activeElement;
      const keepSearch = active && active.classList && active.classList.contains("search");
      const caret = keepSearch ? active.selectionStart : null;
      const map = {
        home: renderHome,
        teacher: renderTeacher,
        detail: renderDetail,
        time: renderTime,
        confirm: renderConfirm,
        success: renderSuccess,
        advisor: renderAdvisor,
        lesson: renderLesson,
        cancelLesson: renderCancelLesson,
        messages: renderMessages,
        help: renderHelp
      };
      $("#app").innerHTML = (map[state.view] || renderHome)();
      if (state.pendingNewTeacherId) {
        $("#app").insertAdjacentHTML("beforeend", changeConfirmHtml());
      }
      if (state.pendingNewSlot) {
        $("#app").insertAdjacentHTML("beforeend", timeConfirmHtml());
      }
      if (state.pendingCancelId) {
        $("#app").insertAdjacentHTML("beforeend", cancelConfirmHtml());
      }
      if (state.pendingBlockedSlot) {
        $("#app").insertAdjacentHTML("beforeend", blockedHtml());
      }
      if (keepSearch) {
        const el = $(".search");
        if (el) {
          el.focus();
          const pos = caret == null ? el.value.length : caret;
          el.setSelectionRange(pos, pos);
        }
      }
    }
    function fitPhone() {
      const vv = window.visualViewport;
      const vw = Math.max(1, vv ? vv.width : window.innerWidth);
      const vh = Math.max(1, vv ? vv.height : window.innerHeight);
      const pw = 375 + 16;
      const ph = 812 + 16;
      const fit = Math.min(1, (vw - 4) / pw, (vh - 4) / ph);
      document.documentElement.style.setProperty("--fit", String(fit));
    }
    window.addEventListener("resize", fitPhone);
    window.addEventListener("orientationchange", fitPhone);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fitPhone);
      window.visualViewport.addEventListener("scroll", fitPhone);
    }
    render();
    fitPhone();
  </script>
</body>
</html>
